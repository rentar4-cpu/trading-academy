<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111c20" />
    <title>Store</title>
    <link rel="manifest" href="/game/manifest.webmanifest" />
    <link rel="icon" href="/game/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/game/styles.css" />
  </head>
  <body data-page="store">
    <main class="shell">
      <section class="topbar">
        <div><p class="eyebrow">Trading Academy</p><h1>Store</h1></div>
        <nav class="app-nav" aria-label="Game navigation">
          <a href="/game/">Market</a><a href="/game/intel.html">Intel</a><a href="/game/trades.html">Trades</a><a href="/game/news.html">News</a><a href="/game/portfolio.html">Portfolio</a><a class="active" href="/game/store.html">Store</a><a href="/game/auth.html">Account</a>
        </nav>
      </section>
      <section class="panel page-panel">
        <div class="panel-head"><div><p class="eyebrow">Store</p><h2>Offers</h2></div></div>
        <div id="offersList" class="offers-list"></div>
      </section>
      <section class="panel page-panel custom-cash-panel">
        <div class="panel-head"><div><p class="eyebrow">Currency</p><h2>Custom Cash</h2></div></div>
        <form id="customCashForm" class="custom-cash-form">
          <label>
            <span>Game cash</span>
            <input id="customCashAmount" type="number" min="1000" step="1000" value="10000" />
          </label>
          <button class="primary" type="submit">Buy Cash</button>
        </form>
        <p class="auth-note" id="customCashNote">Simulated purchase. Real payments can be connected later.</p>
      </section>
      <div class="status-line" id="pageStatus">Loading</div>
    </main>
    <script src="/game/pages.js"></script>
  </body>
</html>
