<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111c20" />
    <title>Mentavio - Recent Trades</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260729-mobile-lists" />
  </head>
  <body data-page="trades">
    <main class="shell">
      <section class="topbar">
        <div class="brand-heading page-brand">
          <span class="mentavio-game-logo" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Mentavio</p>
            <h1>Recent Trades</h1>
          </div>
        </div>
        <nav class="app-nav" aria-label="Game navigation">
          <a href="./index.html">Market</a><a href="./intel.html">Intel</a><a class="active" href="./trades.html">Trades</a><a href="./news.html">News</a><a href="./portfolio.html">Portfolio</a><a href="./store.html">Store</a><a href="./auth.html">Account</a>
        </nav>
        <div class="page-clock">
          <span>Next tick</span>
          <strong id="pageClock">--s</strong>
        </div>
      </section>
      <section class="panel page-panel">
        <div class="panel-head"><div><p class="eyebrow">Tape</p><h2>Trade Tape</h2></div></div>
        <div class="table-wrap compact">
          <table>
            <thead><tr><th>Trader</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th><th>Value</th></tr></thead>
            <tbody id="recentTradesBody"></tbody>
          </table>
        </div>
      </section>
      <div class="status-line" id="pageStatus">Loading</div>
    </main>
    <script src="./runtime-config.js"></script>
    <script src="./pages.js?v=20260729-mobile-lists"></script>
  </body>
</html>
